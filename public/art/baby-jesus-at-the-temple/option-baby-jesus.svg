<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Baby Jesus">
  <!-- The light behind him. Soft, and the only glow of the four. -->
  <circle cx="32" cy="33" r="26" fill="#F2B93E" opacity="0.16" />
  <circle cx="32" cy="33" r="19" fill="#F2B93E" opacity="0.16" />

  <g fill="none" stroke="#123047" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Swaddling: a bundle, wider at the shoulders and tapering to the feet -->
    <path d="M32 22c9 0 14.5 5.4 14.5 13S41.5 58 32 58s-14.5-15.4-14.5-23S23 22 32 22z" fill="#FBF3E0" />
    <path d="M19.5 36c4 2.6 8.2 3.9 12.5 3.9S40.5 38.6 44.5 36" />
    <path d="M22.5 46c3.2 2 6.3 3 9.5 3s6.3-1 9.5-3" />

    <!-- Face, tucked into the wrap -->
    <path d="M32 10c6 0 10 3.9 10 10.5S38 31 32 31s-10-3.9-10-10.5S26 10 32 10z" fill="#F7D3AC" />
    <path d="M28.5 20.5h.01M35.5 20.5h.01" stroke-width="3.2" />
    <path d="M29.8 25.2c1.4 1.1 3 1.1 4.4 0" stroke-width="2" />
    <!-- One curl, so he is a baby and not an egg -->
    <path d="M29 12.4c1-1.6 3.2-2 4.6-.7" stroke-width="2" />
  </g>
</svg>
