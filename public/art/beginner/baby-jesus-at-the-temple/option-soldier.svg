<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="A soldier">
  <g fill="none" stroke="#123047" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spear, behind everything -->
    <path d="M50 58V17" />
    <path d="M50 6.5 53.4 14a4.6 4.6 0 0 1-6.8 0z" fill="#C6D0DC" />

    <!-- Shoulders, in plate -->
    <path d="M11 60c0-8.5 6.4-14 19-14s19 5.5 19 14z" fill="#9FB0C4" />
    <path d="M17 52.5h26M15 57h30" stroke-width="2" />

