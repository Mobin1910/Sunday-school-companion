    <path d="M30 17c6.4 0 10.4 4.2 10.4 11.5S36.4 41 30 41s-10.4-5.2-10.4-12.5S23.6 17 30 17z" fill="#EEC49A" />

    <!-- Helmet: brow band, cheek guards, and the crest across the top. The
