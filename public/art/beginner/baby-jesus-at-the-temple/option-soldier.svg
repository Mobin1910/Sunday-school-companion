    <path d="M17.8 25h24.4" stroke-width="2.4" />
    <path d="M20.6 25c-1 5.6-.3 9.6 2.2 12.2 1.4-3 1.8-7 1.2-12.2zM39.4 25c1 5.6.3 9.6-2.2 12.2-1.4-3-1.8-7-1.2-12.2z" fill="#C6D0DC" />
    <path d="M26 31h.01M34 31h.01" stroke-width="3.2" />
    <path d="M30 4c4.2 0 6.6 3.4 6.6 9.4H23.4C23.4 7.4 25.8 4 30 4z" fill="#C1603F" />
  </g>
</svg>
